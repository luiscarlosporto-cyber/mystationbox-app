<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00507A"/><stop offset=".55" stop-color="#003B5C"/><stop offset="1" stop-color="#00253B"/>
    </linearGradient>
    <linearGradient id="topo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="esq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F36C21"/><stop offset="1" stop-color="#E4561A"/></linearGradient>
    <linearGradient id="dir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9480F"/><stop offset="1" stop-color="#A93A0B"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <!-- traços de velocidade -->
  <g stroke-linecap="round" stroke="#F36C21">
    <line x1="70" y1="214" x2="150" y2="214" stroke-width="22" />
    <line x1="100" y1="268" x2="160" y2="268" stroke-width="22" stroke="#FF9A5C"/>
    <line x1="130" y1="322" x2="170" y2="322" stroke-width="22" stroke="#FFC7A3"/>
  </g>
  <!-- caixa isométrica, inclinada para a frente -->
  <g transform="translate(300 268) skewX(-8)">
    <polygon points="0,-150 128,-76 0,-2 -128,-76" fill="url(#topo)"/>
    <polygon points="-128,-76 0,-2 0,150 -128,76" fill="url(#esq)"/>
    <polygon points="128,-76 0,-2 0,150 128,76" fill="url(#dir)"/>
    <!-- fita / tampa aberta em forma de seta -->
    <polygon points="-64,-113 64,-39 64,-14 -64,-88" fill="#FFFFFF" opacity=".9"/>
    <!-- gota (combustível) na face da frente -->
    <g transform="matrix(1 .58 0 1 -64 38)"><path d="M0,-46 C14,-24 30,-6 30,14 A30,30 0 0 1 -30,14 C-30,-6 -14,-24 0,-46 Z" fill="#FFFFFF"/></g>
  </g>
</svg>
